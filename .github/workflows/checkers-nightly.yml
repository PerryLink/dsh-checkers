name: checker nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 18 * * *'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        repo:
          - dsh-aqua-input-check
          - dsh-archive-check
          - dsh-bid-ca-precheck
          - dsh-bid-qual-check
          - dsh-contract-stance
          - dsh-customs-doc-check
          - dsh-demurrage-ledger
          - dsh-drill-script-check
          - dsh-eia-guide-check
          - dsh-emergency-plan
          - dsh-essay-rubric-check
          - dsh-evidence-check
          - dsh-export-ctl-check
          - dsh-fmea-table-check
          - dsh-forecast-penalty
          - dsh-gongwen-flow-check
          - dsh-gongwen-word-check
          - dsh-guard-plan-qc
          - dsh-hazchem-check
          - dsh-hazplan-check
          - dsh-hidden-risk-map
          - dsh-hs-classify
          - dsh-icd-rule-check
          - dsh-lawcite-adapter
          - dsh-lc-doc-check
          - dsh-learning-gap-check
          - dsh-medrec-qc
          - dsh-nsfc-form-check
          - dsh-nurse-record-check
          - dsh-origin-rvc-check
          - dsh-ota-review-check
          - dsh-paper-doc-adapter
          - dsh-permit-report-check
          - dsh-pipeline-check
          - dsh-pleading-draft
          - dsh-policy-brief-draft
          - dsh-power-loss-split
          - dsh-power-ticket-check
          - dsh-ppap-check
          - dsh-protest-deadline
          - dsh-railway-window
          - dsh-repair-order-qc
          - dsh-review-reply-check
          - dsh-rulefile-check
          - dsh-safety-brief-check
          - dsh-site-log-check
          - dsh-soe-decision-check
          - dsh-soilwater-check
          - dsh-sop-sync-check
          - dsh-spc-gbt-adapter
          - dsh-tender-extract
          - dsh-tender-matrix
          - dsh-warranty-calc
    steps:
      - name: Clone checker
        run: git clone --depth 1 "https://github.com/PerryLink/${{ matrix.repo }}.git" repo
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: repo/pnpm-lock.yaml
      - name: Install
        working-directory: repo
        run: pnpm install --frozen-lockfile
      - name: Typecheck and test
        working-directory: repo
        run: |
          pnpm run typecheck
          pnpm test
